services:
  # Servidor Web Nginx (Expone el puerto 80 / 8080 en la IP local y VPN)
  nginx:
    image: nginx:alpine
    container_name: cambiocuba_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../laravel-backend:/var/www/html
      - ../dist:/var/www/html/public/spa
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel_app
    networks:
      - cambiocuba_network

  # Backend PHP 8.3-FPM (Laravel 11)
  laravel_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cambiocuba_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ../laravel-backend:/var/www/html
      - ../backups:/var/www/html/storage/app/backups
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db_mysql
      DB_PORT: 3306
      DB_DATABASE: cambiocuba_db
      DB_USERNAME: cambiocuba_user
      DB_PASSWORD: ${DB_PASSWORD:-CambioCubaSecure2026!}
    depends_on:
      - db_mysql
    networks:
      - cambiocuba_network

  # Base de Datos MySQL 8.0 con Auditoría y Persistencia
  db_mysql:
    image: mysql:8.0
    container_name: cambiocuba_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootMasterSecure2026!}
      MYSQL_DATABASE: cambiocuba_db
      MYSQL_USER: cambiocuba_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-CambioCubaSecure2026!}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backups:/backups
    networks:
      - cambiocuba_network

  # Administrador Web de Base de Datos para auditoría local
  adminer:
    image: adminer:latest
    container_name: cambiocuba_adminer
    restart: unless-stopped
    ports:
      - "8088:8080"
    networks:
      - cambiocuba_network

networks:
  cambiocuba_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
