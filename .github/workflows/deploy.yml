name: CI/CD & Auto-Deploy CambioCuba PRO

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test_and_build:
    name: 🧪 Pruebas y Compilación en la Nube
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias del Frontend
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Compilar Frontend de Producción
        run: npm run build

  deploy_self_hosted:
    name: 💻 Auto-Despliegue en PC Local (GitHub Runner)
    needs: test_and_build
    if: github.ref == 'refs/heads/main'
    # Se ejecuta en la PC del usuario si registró un Self-Hosted Runner de GitHub
    runs-on: self-hosted
    continue-on-error: true

    steps:
      - name: Descargar Código en PC Local
        uses: actions/checkout@v4

      - name: Ejecutar Script de Actualización Local
        run: |
          chmod +x scripts/update-local.sh
          ./scripts/update-local.sh

  deploy_ssh:
    name: 🌐 Despliegue Remoto Alternativo vía SSH
    needs: test_and_build
    if: github.ref == 'refs/heads/main' && false # Activar si se configuran los secretos SSH en GitHub
    runs-on: ubuntu-latest

    steps:
      - name: Conectar vía SSH y Desplegar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLIENT_PC_HOST }}
          username: ${{ secrets.CLIENT_PC_USER }}
          key: ${{ secrets.CLIENT_PC_SSH_KEY }}
          port: ${{ secrets.CLIENT_PC_SSH_PORT || 22 }}
          script: |
            cd ~/cambiocuba || cd /opt/cambiocuba
            git pull origin main
            npm install
            npm run build
