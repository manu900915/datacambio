name: CI/CD & Auto-Deploy CambioCuba PRO

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test_and_build:
    name: 🧪 Pruebas y Compilación en la Nube
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias del Frontend
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Compilar Frontend de Producción
        run: npm run build

  deploy_self_hosted:
    name: 💻 Auto-Despliegue en PC Local (GitHub Runner)
    needs: test_and_build
    if: github.ref == 'refs/heads/main'
    # Espera máximo 5 minutos por si tu PC tiene el runner encendido
    timeout-minutes: 5
    runs-on: self-hosted
    continue-on-error: true

    steps:
      - name: Descargar Código en PC Local
        uses: actions/checkout@v4

      - name: Compilar Frontend en PC Local
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Actualizar carpeta de trabajo en la PC (~/untitled o ~/datacambio)
        run: |
          for TARGET in "$HOME/untitled" "$HOME/datacambio" "/opt/cambiocuba"; do
            if [ -d "$TARGET/.git" ] && [ "$TARGET" != "$GITHUB_WORKSPACE" ]; then
              echo "Actualizando automáticamente $TARGET..."
              cd "$TARGET"
              git fetch origin main
              git reset --hard origin/main
              npm install --legacy-peer-deps || true
              npm run build || true
              if [ -f "docker/docker-compose.yml" ] && command -v docker >/dev/null 2>&1; then
                docker compose -f docker/docker-compose.yml up -d --build 2>/dev/null || true
              fi
            fi
          done
          echo "✅ ¡Auto-despliegue completado con éxito en tu PC!"

  deploy_ssh:
    name: 🌐 Despliegue Remoto Alternativo vía SSH
    needs: test_and_build
    if: github.ref == 'refs/heads/main' && false # Activar si se configuran los secretos SSH en GitHub
    runs-on: ubuntu-latest

    steps:
      - name: Conectar vía SSH y Desplegar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLIENT_PC_HOST }}
          username: ${{ secrets.CLIENT_PC_USER }}
          key: ${{ secrets.CLIENT_PC_SSH_KEY }}
          port: ${{ secrets.CLIENT_PC_SSH_PORT || 22 }}
          script: |
            cd ~/cambiocuba || cd /opt/cambiocuba
            git pull origin main
            npm install
            npm run build
